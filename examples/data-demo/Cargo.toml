[package]
name = "data-demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

# Milestone 47's example: cached, deduplicated, paginated data with
# optimistic updates and offline queueing, and a failing widget contained
# and retried — against an in-process server.
[dependencies]
rustnative-core.workspace = true
rustnative-data.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true

[dev-dependencies]
rustnative-headless.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustnative-linux.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
rustnative-windows.workspace = true
