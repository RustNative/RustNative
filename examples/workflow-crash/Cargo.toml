[package]
name = "workflow-crash"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

# Milestone 56's example: a durable workflow is killed mid-step, then
# completes with each step executed exactly once.
[dependencies]
rustnative-durable.workspace = true
rustnative-server.workspace = true
async-trait.workspace = true
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { workspace = true, features = ["rt", "macros"] }
