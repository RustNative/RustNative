[package]
name = "live-counter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

# Milestone 55's server-interactive example.
[dependencies]
rustnative-core.workspace = true
rustnative-sync.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }

[dev-dependencies]
rustnative-headless.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustnative-linux.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
rustnative-windows.workspace = true
