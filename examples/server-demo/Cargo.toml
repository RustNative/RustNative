[package]
name = "server-demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

# Milestone 49's example: an authenticated, SQLite-backed, job-processing
# server whose functions the Windows client calls (examples/server-client).
[dependencies]
rustnative-core.workspace = true
rustnative-server.workspace = true
notes-shared = { path = "../notes-shared", version = "0.1.0", features = ["server"] }
async-trait.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["net", "time", "rt-multi-thread", "macros", "signal"] }
bytes = "1"
http = "1"
