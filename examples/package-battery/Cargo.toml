[package]
name = "package-battery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

# Milestone 52's sample capability package: what a third party publishes.
# `rustnative add` reads this table before adding the package, and an
# index lists it (`docs/packages.md`).
[package.metadata.rustnative]
contract = "BatteryService"
backends = ["windows", "headless"]
framework = ">=0.1, <0.2"
grants = []

[dependencies]
rustnative-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
toml = "1"
