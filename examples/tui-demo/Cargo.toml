[package]
name = "tui-demo"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# A terminal application (`PLAN.md` Milestone 38): the core and the
# terminal backend, and nothing that needs a desktop — it runs on a
# server, over SSH, or on a serial console.
[dependencies]
rustnative-core.workspace = true
rustnative-tui.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_Storage_FileSystem"] }
