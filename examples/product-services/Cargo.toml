[package]
name = "product-services"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

# Milestone 57's example: the tray, a jump list, taskbar progress, a
# notification, secure token storage, and a remotely toggled feature.
[dependencies]
rustnative-core.workspace = true

[dev-dependencies]
rustnative-headless.workspace = true
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rustnative-linux.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
rustnative-windows.workspace = true
