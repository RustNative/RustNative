[package]
name = "rustnative-sync"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Milestone 55: sync, server-interactive mode, and device desired state.
[dependencies]
rustnative-core.workspace = true
async-trait.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["sync", "rt", "time", "net", "io-util", "macros"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustnative-server = { workspace = true, optional = true }
# Mounting live sessions on a server application's own listener.
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }

[features]
# The sync endpoints on a `rustnative-server` application.
server = ["dep:rustnative-server", "dep:hyper", "dep:hyper-util", "dep:http", "dep:bytes"]

[dev-dependencies]
serde_json = "1"
proptest = "1"
tokio = { workspace = true, features = ["rt-multi-thread"] }
