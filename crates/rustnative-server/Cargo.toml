[package]
name = "rustnative-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Milestone 49: the server application model, on the Rust server
# ecosystem's service abstraction (`tower::Service` over `http` types,
# served by `hyper`).
[dependencies]
rustnative-core.workspace = true
# Pages: the Web backend's renderer, runtime, and client modules.
rustnative-web.workspace = true
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
getrandom = "0.2"
base64 = "0.22"
async-trait.workspace = true
rustnative-server-macros.workspace = true
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
aes-gcm = "0.10"
argon2 = "0.5"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
hyper = { version = "1", features = ["client", "server", "http1"] }
# Pages in a real browser, and live subtrees served on the application's port.
rustnative-web-testing.workspace = true
rustnative-sync = { workspace = true, features = ["server"] }
aes-gcm = "0.10"
hkdf = "0.12"

[features]
default = ["health", "metrics"]
# `/healthz` and `/readyz`.
health = []
# `/metrics` in the Prometheus text format.
metrics = []
