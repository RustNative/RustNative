[package]
name = "rustnative-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Milestone 49: the server application model, on the Rust server
# ecosystem's service abstraction (`tower::Service` over `http` types,
# served by `hyper`).
[dependencies]
# The core without its thread pool: the request pipeline also builds for
# `wasm32-wasip1` (a function per request on an edge host); `serve` turns
# the pool back on.
rustnative-core = { path = "../rustnative-core", version = "0.1.0", default-features = false, features = ["markup", "os-random"] }
# Pages: the Web backend's renderer, runtime, and client modules.
rustnative-web.workspace = true
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tower-service = "0.3"
tokio = { version = "1.53", default-features = false, features = ["time", "sync", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
getrandom = "0.2"
base64 = "0.22"
async-trait.workspace = true
rustnative-server-macros.workspace = true
rusqlite = { version = "0.40", default-features = false, features = ["bundled"], optional = true }
aes-gcm = "0.10"
argon2 = "0.5"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
hyper = { version = "1", features = ["client", "server", "http1"] }
# Pages in a real browser, and live subtrees served on the application's port.
rustnative-web-testing.workspace = true
rustnative-sync = { workspace = true, features = ["server"] }
# WebAssembly subtrees, built for the browser by the test.
web-subtree = { path = "../../examples/web-subtree", version = "0.1.0" }
aes-gcm = "0.10"
hkdf = "0.12"

[features]
default = ["health", "metrics", "serve", "db", "web"]
# Serving on a socket: the listener, WebSocket upgrades, the local deploy
# proxy.
serve = ["dep:hyper", "dep:hyper-util", "tokio/net", "tokio/rt-multi-thread", "rustnative-core/threads"]
# SQLite: data, jobs, the admin surface, row policies.
db = ["dep:rusqlite"]
# Pages (`rustnative_web`): always part of the pipeline; the feature names
# them for builds that list what they take.
web = []
# `/healthz` and `/readyz`.
health = []
# `/metrics` in the Prometheus text format.
metrics = []
