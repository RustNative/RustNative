[package]
name = "rustnative-android"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Android backend for Rust Native: platform views, StaticLayout text, AccessibilityNodeInfo, and the Android services"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gui", "android", "native", "mobile", "framework"]
categories = ["gui", "os"]
# The Java host library the backend ships with: `rustnative build android`
# copies it into the generated Gradle project.
include = ["src/**/*", "java/**/*", "Cargo.toml"]

[lints]
workspace = true

[features]
# The device suite (`device_tests`), run inside a real activity by
# `examples/android-device-tests` and `tools/android-device-test.sh`.
device-tests = ["dep:rustnative-conformance"]

[dependencies]
rustnative-core.workspace = true
# The style capability table and unit mapping this backend answers with.
rustnative-style.workspace = true
# The data layer's host contracts (`services::data`, `services::work`).
rustnative-data.workspace = true
rustnative-conformance = { workspace = true, optional = true }
# A native surface's handle in the form every Rust graphics library takes.
raw-window-handle = "0.6"
# Updates (`update`): the desktops' signed manifest — Ed25519 over JSON —
# and the package's SHA-256.
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
# The JNI boundary (`jni_host`, the one module that names it). 0.21 is the
# release whose API the backend is written against; its MSRV is 1.65.
jni = "0.21.1"
# The service contracts are async (`async-trait`), and a service awaits its
# main-thread half on a Tokio channel.
async-trait.workspace = true
tokio.workspace = true
# The main-looper wake pipe (`looper`).
libc = "0.2"
