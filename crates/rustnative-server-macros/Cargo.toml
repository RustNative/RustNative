[package]
name = "rustnative-server-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Compile-time-checked SQL for Rust Native's server: query!"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "column_decltype"] }
