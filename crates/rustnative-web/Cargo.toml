[package]
name = "rustnative-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Web backend of Rust Native: semantic HTML, CSS, and compile-time generated JavaScript, with WebAssembly for the subtrees that opt in"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gui", "web", "html", "native", "framework"]
categories = ["gui", "web-programming", "wasm"]

[lints]
workspace = true

# The core without its thread pool or the operating system's random source:
# this crate also builds for `wasm32-unknown-unknown`, where a WebAssembly
# subtree runs, and a native build turns both back on through whichever
# other crate asks for the core's defaults.
[dependencies]
rustnative-core = { path = "../rustnative-core", version = "0.1.0", default-features = false, features = ["markup"] }
rustnative-style.workspace = true
# #[client] and #[server].
rustnative-web-macros.workspace = true
serde = { version = "1", features = ["derive"] }
# Exact float parsing: a float crossing between the browser and Rust reads
# back as the value that was written.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The loading path (`C42`): responsive images as WebP, and fonts subset to
# the text they set. Pure Rust, so the crate still builds for the browser.
image-webp = "0.2"
subsetter = "0.2"
skrifa = "0.42"

# A WebAssembly subtree's services, bridged to the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
async-trait.workspace = true

[dev-dependencies]
rustnative-core.workspace = true
rustnative-web-testing.workspace = true
