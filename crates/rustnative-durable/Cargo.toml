[package]
name = "rustnative-durable"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust Native durable execution: replayed workflows, event handlers, actors, and supervision"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["workflow", "durable", "actor", "serverless", "framework"]
categories = ["asynchronous"]

[lints]
workspace = true

# Milestone 56: durable workflows, event handlers, actors, and supervision.
# They are journaled in SQLite through rustnative-server's data layer
# (`local`, the default). Without it the crate is the actor contract and its
# edge adapter, which build for `wasm32-wasip1` (Web milestone K, `C46`).
[features]
default = ["local"]
local = ["rustnative-server/default", "rustnative-core/default", "dep:rusqlite", "tokio/rt-multi-thread"]

[dependencies]
rustnative-core = { path = "../rustnative-core", version = "0.1.0", default-features = false, features = ["markup"] }
rustnative-server = { path = "../rustnative-server", version = "0.1.0", default-features = false, features = ["web"] }
async-trait.workspace = true
rusqlite = { version = "0.40", default-features = false, features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
tokio = { version = "1.53", default-features = false, features = ["sync", "rt", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

# A watched operation's state as the client's `OperationState`: a native
# client's type (the data layer runs threads, which an edge module has not).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustnative-data = { path = "../rustnative-data", version = "0.1.0" }
