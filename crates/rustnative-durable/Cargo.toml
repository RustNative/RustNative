[package]
name = "rustnative-durable"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Milestone 56: durable workflows, event handlers, actors, and supervision.
# They are journaled in SQLite through rustnative-server's data layer.
[dependencies]
rustnative-core.workspace = true
rustnative-server.workspace = true
async-trait.workspace = true
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
