[package]
name = "rustnative-markup"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The markup syntax of Rust Native: one grammar, parsed and lowered to builder calls, shared by the rsx! macro, the .rsx compiler, and the CLI"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gui", "markup", "rsx", "native", "framework"]
categories = ["gui", "development-tools::procedural-macro-helpers"]

[lints]
workspace = true

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
prettyplease = "0.2"
