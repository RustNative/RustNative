[package]
name = "rustnative-types"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "no_std value types shared by every Rust Native target: geometry, colour, and totally ordered scalars"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gui", "no-std", "geometry", "native", "framework"]
categories = ["gui", "no-std"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[features]
default = []
# Serialization for targets that persist or transmit these values; the core
# enables it, a bare-metal build need not.
serde = ["dep:serde"]
