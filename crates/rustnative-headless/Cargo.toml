[package]
name = "rustnative-headless"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The headless reference backend for Rust Native: realizes the tree into an inspectable model and drives it with synthetic input, on any machine"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gui", "testing", "headless", "native", "framework"]
categories = ["gui", "development-tools::testing"]

[lints]
workspace = true

[dependencies]
rustnative-core.workspace = true
# The style capability table and unit mapping this backend answers with.
rustnative-style.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
# The inspection protocol's state values (`rustnative_core::inspect`).
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
