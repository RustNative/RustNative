[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A Rust-first, native-control-oriented cross-platform application framework"
repository = "https://github.com/<org>/RustNative"
homepage = "https://github.com/<org>/RustNative"
readme = "README.md"
keywords = ["gui", "windows", "native", "framework", "ui"]
categories = ["gui", "os::windows-apis"]

[workspace.dependencies]
# `version` alongside `path` is not redundant: a path-only dependency is a
# wildcard requirement, which `cargo deny check bans` rejects and which makes
# the crate unpublishable — `cargo publish` refuses a dependency with no
# version requirement, because a consumer resolving from a registry has no
# path to follow. With both, a workspace build still uses the path and a
# published build gets a real requirement.
rustnative-build = { path = "crates/rustnative-build", version = "0.1.0" }
rustnative-core = { path = "crates/rustnative-core", version = "0.1.0" }
rustnative-windows = { path = "crates/rustnative-windows", version = "0.1.0" }
rustnative-types = { path = "crates/rustnative-types", version = "0.1.0" }
rustnative-headless = { path = "crates/rustnative-headless", version = "0.1.0" }
rustnative-markup = { path = "crates/rustnative-markup", version = "0.1.0" }
rustnative-macros = { path = "crates/rustnative-macros", version = "0.1.0" }
rustnative-style = { path = "crates/rustnative-style", version = "0.1.0" }
rustnative-interop = { path = "crates/rustnative-interop", version = "0.1.0" }
rustnative-i18n = { path = "crates/rustnative-i18n", version = "0.1.0" }
rustnative-data = { path = "crates/rustnative-data", version = "0.1.0" }
rustnative-components = { path = "crates/rustnative-components", version = "0.1.0" }
rustnative-server = { path = "crates/rustnative-server", version = "0.1.0" }
rustnative-server-macros = { path = "crates/rustnative-server-macros", version = "0.1.0" }
rustnative-sync = { path = "crates/rustnative-sync", version = "0.1.0" }
rustnative-durable = { path = "crates/rustnative-durable", version = "0.1.0" }
rustnative-observe = { path = "crates/rustnative-observe", version = "0.1.0" }
rustnative-conformance = { path = "crates/rustnative-conformance", version = "0.1.0" }
tokio = { version = "1.53", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync"] }
parking_lot = "0.12"
async-trait = "0.1"
windows-sys = { version = ">=0.59, <=0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Multimedia",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    # Milestone 51: crash capture, the isolated worker, printing, and
    # serial ports.
    "Win32_Devices_Communication",
    "Win32_Graphics_Printing",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    # Milestone 57: secure storage.
    "Win32_Security_Credentials",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
too_many_arguments = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
# P2.40: move from the previous minimal, ad hoc lint set to a deliberately
# curated policy — broad `pedantic`/`cargo` coverage, with specific `allow`s
# only where this codebase makes a considered, load-bearing exception
# (documented per lint below) rather than blanket-suppressing an entire
# category.
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# `unsafe_op_in_unsafe_fn` (above) already denies the sharper, more
# consequential half of this lint's concern — an `unsafe fn`'s body
# silently treating its *entire* scope as pre-audited. The remaining
# "explain why this whole function is unsafe" question is answered, in
# `rustnative-windows`, per call site by that crate's own safety-comment
# discipline (see its module docs) rather than forced into a doc section on
# every signature; duplicating the same explanation at both levels would
# drift, not add safety.
missing_safety_doc = "allow"
# This crate's modules are intentionally named after the *domain concept*
# they own (`identity::ComponentId`, `layout::LayoutEngine`,
# `scheduler::Scheduler`), which is what the standards audit's own
# recommended module map asks for — not an accident this lint should flag.
module_name_repetitions = "allow"

# P2.40's second half: `pedantic`/`cargo` above are lint *groups*, but the
# audit also asks for individually chosen `restriction` lints — and is
# explicit that the group must not be enabled wholesale ("Clippy itself
# explicitly warns against enabling the entire restriction group"). These
# are the ones that encode a rule this framework actually wants held.
#
# Panicking accessors. A framework is library code: it runs inside somebody
# else's process, and a panic it raises is a crash they cannot catch at a
# call site they did not write. Both are `warn` rather than `deny` because
# there is a legitimate, load-bearing exception — an internal invariant the
# runtime itself just established, where the alternative is threading a
# `Result` through code that has no way to handle it (see
# `component::RenderError`'s docs for exactly where this crate draws that
# line). Every remaining use carries an `#[allow]` with its reason, and
# tests are exempt below.
unwrap_used = "warn"
expect_used = "warn"
# Unfinished code must never reach a release. Nothing in this workspace
# uses these, and `deny` is what keeps it that way.
todo = "deny"
unimplemented = "deny"
# Numeric conversions across the FFI boundary are where a silent wrap turns
# into a wrong window size or a negative dimension. These are already
# handled deliberately throughout `layout` and `rustnative-windows` (every
# cast is preceded by a `.min`/`.max`/`saturating_*` that establishes range,
# with a named `#[allow]` and a comment); `deny` locks that discipline in.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
# Integer arithmetic that can silently wrap in release builds. `warn`, not
# `deny`: the layout engine is exhaustively saturating, but bookkeeping
# arithmetic on collection lengths and loop counters is not a hazard worth
# rewriting.
arithmetic_side_effects = "allow"
# Indexing that can panic. Slice/map indexing in this workspace is either on
# a collection the same function just built or guarded by a preceding
# `contains`/`len` check.
indexing_slicing = "allow"
