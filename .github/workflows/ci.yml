  #       run: |
  #         sudo dpkg --add-architecture i386
  #         sudo apt-get update
  #         sudo apt-get install -y gcc-mingw-w64-x86-64 wine wine64
  #     - name: cross-compile + run tests under Wine
  #       run: ./tools/windows-cross-test.sh
  #     - name: cross-compile clippy under Wine's toolchain
  #       run: |
  #         RUSTC_BOOTSTRAP=1 cargo clippy \
  #           -Z build-std=core,alloc,std,panic_abort,test \
  #           --target x86_64-pc-windows-gnu --workspace --all-targets \
  #           -- -D warnings

  test-windows:
    name: build + test (windows, native backend)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # The serverless and web tests build these.
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (native backend included)
        run: cargo check --workspace --all-targets
      - name: cargo test (native backend included)
        run: cargo test --workspace
      # Tests that need the interactive desktop's real cursor or the system
      # clipboard are `#[ignore]`d so a restricted local shell reports them
      # as not run instead of failing or silently passing; the runner's
      # interactive session can run them, so it does — all but real-cursor
      # hover, where `SetCursorPos` succeeds but no mouse message reaches the
      # test window; it is owed to an attended desktop (BUILD_STATUS.md).
      - name: cargo test (interactive-desktop tests)
        run: cargo test --workspace -- --ignored --skip native_pointer_hover_follows_the_real_cursor
      - name: cargo clippy (native backend included)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
