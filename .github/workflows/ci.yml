name: CI

# This workflow closes the standards audit's P1.17 finding: before it
# existed, nothing in this repository's history had ever actually compiled
# `rustnative-windows`'s `native` module — it is `#[cfg(windows)]`-gated, and
# every prior development/review pass ran on Linux, where that module is
# simply excluded from the build. `cargo check`/`cargo test` on Linux only
# ever validated `rustnative-core` and the small `#[cfg(windows)]`-free
# surface of `rustnative-windows` (errors, the `Platform` trait impl
# signature, service traits). `test-windows` (a real Windows runner) and
# `windows-cross-wine` (a fast, Linux-hosted signal using this repository's
# own `tools/windows-cross-test.sh`) are what actually build and test the
# real Win32 window backend.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # `RUSTFLAGS` does not reach rustdoc, so a broken intra-doc link or an
  # undocumented public item would otherwise pass CI as a warning. Both
  # crates carry `#![deny(missing_docs)]`; this is what makes the rest of
  # rustdoc's lints equally binding.
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: GTK 4 and libsoup 3 (the Linux backend's libraries)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libsoup-3.0-dev
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-linux:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The serverless and web tests build these.
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: GTK 4 and libsoup 3 (the Linux backend's libraries)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libsoup-3.0-dev
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        # The GTK backend's own tests need a display; `linux-backend` runs them.
        run: cargo test --workspace --exclude rustnative-linux
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  linux-backend:
    # Milestone 34: the GTK backend against real GTK, on a virtual X server
    # and a private session bus (`tools/linux-session.sh`), with AT-SPI,
    # a keyring, and the test locales the services' tests read back.
    name: Linux backend (GTK 4 on Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GTK, libsoup, and the session's services
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libsoup-3.0-dev xvfb xdotool dbus dbus-x11 at-spi2-core gnome-keyring locales
          sudo locale-gen en_NZ.UTF-8 de_DE.UTF-8 fr_FR.UTF-8 tr_TR.UTF-8
      - name: cargo test -p rustnative-linux -p adoption-gtk (Xvfb)
        run: tools/linux-session.sh xvfb cargo test -p rustnative-linux -p adoption-gtk

  linux-backend-distros:
    # The same tests on the other two package families: Fedora (RPM) and
    # Arch Linux (pacman), each in its own container with its own GTK. The
    # packaging tests run here too, so the real `rpm` and `pacman` read the
    # packages `rustnative package linux` writes.
    name: Linux backend (${{ matrix.distro }}, GTK 4 on Xvfb)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:latest
            setup: |
              dnf -y install gcc pkgconf-pkg-config git curl gtk4-devel libsoup3-devel xorg-x11-server-Xvfb xdotool dbus-daemon dbus-tools at-spi2-core gnome-keyring mesa-dri-drivers mesa-libEGL libglvnd-gles dejavu-sans-fonts google-noto-sans-fonts glibc-langpack-en glibc-langpack-de glibc-langpack-fr glibc-langpack-tr rpm
          - distro: arch
            image: archlinux:latest
            setup: |
              pacman -Syu --noconfirm --needed base-devel git curl gtk4 libsoup3 xorg-server-xvfb xdotool dbus at-spi2-core gnome-keyring mesa ttf-dejavu noto-fonts
              sed -i 's/^#\(en_US\|en_NZ\|de_DE\|fr_FR\|tr_TR\)\.UTF-8/\1.UTF-8/' /etc/locale.gen
              locale-gen
    container: ${{ matrix.image }}
    steps:
      - name: GTK, libsoup, and the session's services
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}
      - name: cargo test -p rustnative-linux -p adoption-gtk (Xvfb)
        run: tools/linux-session.sh xvfb cargo test -p rustnative-linux -p adoption-gtk
      - name: the Linux packages, read back by the distribution's own tools
        run: cargo test -p rustnative-cli --bin rustnative -- package::linux toolchain::linux_distro doctor

  android:
    # Milestone 35: the Android backend for the four ABIs, linted for the
    # device target, its host tests, and the device suite on an emulator
    # (`tools/android-device-test.sh`). The runner's preinstalled SDK and
    # NDK are used; Gradle 8.10.2 builds the generated project.
    name: Android backend (emulator, API 35)
    runs-on: ubuntu-latest
    env:
      RUSTNATIVE_ANDROID_API: "26"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: The SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: clippy for the device target, and every ABI
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          source tools/android-env.sh
          cargo clippy -p rustnative-android --no-deps --target aarch64-linux-android -- -D warnings
          cargo clippy -p rustnative-android --no-deps --target aarch64-linux-android --features device-tests -- -D warnings
          for target in armv7-linux-androideabi x86_64-linux-android i686-linux-android; do
            cargo check -p rustnative-android --target "$target"
          done
          RUSTDOCFLAGS="-D warnings" cargo doc -p rustnative-android --target aarch64-linux-android --no-deps
      - name: host tests
        run: cargo test -p rustnative-android && cargo test -p rustnative-build android
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: the device suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # The Play image carries TalkBack, which the accessibility suite starts.
          target: google_apis_playstore
          # The transition tests need motion: off, they would see reduced motion.
          disable-animations: false
          script: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" tools/android-device-test.sh

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: GTK 4 and libsoup 3 (the Linux backend's libraries)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libsoup-3.0-dev
      - name: cargo check (MSRV)
        run: cargo check --workspace --all-targets

  no-std:
    # The roadmap's no_std-capable core subset: `rustnative-types` must build
    # for a bare-metal target with neither `std` nor `alloc`.
    name: no_std value types (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: cargo build rustnative-types (bare metal)
        run: cargo build -p rustnative-types --target thumbv7em-none-eabihf

  headless:
    # Milestone 45: the application layer's component, interaction, golden,
    # and lifecycle tests run on a machine with none of the target hardware.
    # A second, constrained run pins the process to one core — the low-end
    # reference profile until a device matrix exists.
    name: headless backend (ubuntu, and one core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p rustnative-headless
        run: cargo test -p rustnative-headless
      - name: cargo test -p rustnative-headless (one core)
        run: taskset -c 0 cargo test -p rustnative-headless -- --test-threads=1

  budgets:
    # Milestone 42: each shipped target's budget file, enforced. A
    # measurement over its budget (beyond its declared noise) fails the
    # build like a failing test; the report is kept either way.
    name: budgets (windows, and headless on one core)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bench: cargo run --release -p rustnative-cli -- bench --target windows --check --build-times --unpaced-display
          - os: ubuntu-latest
            bench: taskset -c 0 cargo run --release -p rustnative-cli -- bench --target headless --check --low-end
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GTK 4 and libsoup 3 (the workspace builds the Linux backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libsoup-3.0-dev
      - name: rustnative bench --check
        run: ${{ matrix.bench }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-report-${{ matrix.os }}
          path: target/budget-report.json

  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: cargo audit

  # This isn't working properly with GitHub Actions
  # windows-cross-wine:
  #   name: Windows cross-compile + Wine (ubuntu, fast signal)
  #   runs-on: ubuntu-latest
  #   # Complements `test-windows` below rather than replacing it: this job
  #   # proves `rustnative-windows`'s native module compiles, links, and
  #   # behaves plausibly under Wine on every push/PR, using only Ubuntu
  #   # runner minutes and without waiting on the (often busier)
  #   # `windows-latest` runner queue — see `tools/windows-cross-test.sh` for
  #   # exactly what "behaves plausibly under Wine" does and does not verify
  #   # relative to real Windows.
  #   #
  #   # RUSTFLAGS is cleared for this job: the workflow-level `-D warnings`
  #   # would otherwise apply to `-Z build-std`'s from-source compilation of
  #   # `core`/`alloc`/`std` themselves, which this repository does not
  #   # control the warning-cleanliness of.
  #   env:
  #     RUSTFLAGS: ""
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #       with:
  #         components: clippy
  #     - uses: Swatinem/rust-cache@v2
