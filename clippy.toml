# Workspace-wide clippy configuration.
#
# Lint *levels* (which lints are warn/deny) live in `[workspace.lints]` in the
# root Cargo.toml, per Rust 2024's native workspace-lints support. This file
# is for the handful of lints that take a threshold rather than an on/off
# switch.

# `rustnative-windows`'s Win32 message-dispatch `match` arms are legitimately
# large; keep clippy's default rather than fighting the lint on structurally
# necessary code, but keep the value explicit here instead of implicit.
too-many-lines-threshold = 200

# `services::dialogs`'s dependency on the `windows` crate (see its own
# module docs for why, and `Cargo.toml`'s comment on the same dependency)
# pulls in its own, independently-versioned proc-macro toolchain (a second
# `syn` major version) alongside this workspace's own `syn` v3 dependency.
# This is a real, but externally-imposed and cosmetic (proc-macro-only,
# nothing at runtime) duplication this workspace does not control — the
# `windows` crate ecosystem's own release cadence, not a choice made here —
# so it is named as an accepted exception rather than left for
# `multiple_crate_versions` to flag as if it were an oversight.
#
# `rustnative-android`'s `jni` 0.21 adds two more of the same kind: its
# `jni-sys` 0.3.1 is a compatibility shim re-exporting `jni-sys` 0.4 (the
# "semver trick"), and its `windows-sys` 0.45 is a Windows-only dependency
# never built for Android. Neither is code this workspace runs twice.
allowed-duplicate-crates = ["syn", "jni-sys", "windows-sys"]

# `unwrap_used`/`expect_used` (see `[workspace.lints.clippy]` in the root
# Cargo.toml) are about *library* code panicking inside somebody else's
# process. A test that unwraps is stating an expectation — the panic is the
# assertion, and rewriting it as a `match` that calls `panic!` anyway would
# be strictly worse. Clippy has first-class support for exactly this
# distinction, so it is used rather than sprinkling `#[allow]` over every
# test module.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Proper names the Linux backend's documentation uses, which
# `doc_markdown` would otherwise ask to be code (`..` keeps clippy's own
# list).
doc-valid-idents = ["..", "XTest", "LXQt", "WSLg", "Xwayland", "GNOME", "KDE", "AppImage", "AppStream", "GDBus", "GLib", "GObject", "OpenURI", "FileChooser", "NetworkManager", "UPower", "UnifiedPush", "KWallet", "KeePassXC", "StatusNotifierItem", "XEmbed", "AppIndicator", "GApplication", "EndeavourOS", "CentOS", "TalkBack", "HyperOS", "AndroidX"]
