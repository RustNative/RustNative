[advisories]
yanked = "deny"

[licenses]
version = 2
# Every dependency must be compatible with this workspace's own
# "MIT OR Apache-2.0" declaration (see [workspace.package] in Cargo.toml).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    # `libloading`, through the Wayland client library (Linux backend).
    "ISC",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
